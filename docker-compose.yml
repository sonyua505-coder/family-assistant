# 家庭信息助理系统 · API 部署（设计文档 §10）
# 用法：cp deploy/env.example .env && 编辑 .env → docker compose up -d --build
#
# 安全边界（§9）：
#  - API 端口 3000 不映射到宿主（astrbot 经共享 Docker 网络 homeassistant-net 内网访问）
#  - 记账 Web 8081 只绑定宿主 ZT_IP（ZeroTier 网卡 IP），不暴露公网
services:
  api:
    build: .
    container_name: homeassistant-api
    restart: unless-stopped
    environment:
      API_PORT: "3000"
      WEB_PORT: "8081"
      DB_PATH: /data/app.db
      X_API_KEY: ${X_API_KEY}
      ADMIN_KEY: ${ADMIN_KEY}
      PUBLIC_WEB_BASE: ${PUBLIC_WEB_BASE}
      ZT_IP: ${ZT_IP}
      BACKUP_DIR: /backup
      TZ: Asia/Shanghai
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SCHEDULER_ENABLED: "true"
    volumes:
      - ./data:/data      # SQLite 数据（备份重点）
      - ./backup:/backup  # 每日冷备输出
    ports:
      - "${ZT_IP:-127.0.0.1}:8081:8081"
    networks:
      - appnet
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  appnet:
    external: true   # 与 astrbot 共用的外部网络：docker network create homeassistant-net
